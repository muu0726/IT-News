name: IT Info Collector - 定期実行

on:
  schedule:
    # UTC 19:17 = JST 04:17 に起動（schedule の遅延対策で前倒し・毎時0分を回避）
    # 収集・デプロイは即時、通知は notify ジョブが NOTIFY_AT_JST (07:00) まで待機してから送信する
    - cron: '17 19 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  collect:
    environment:
      name: github-pages
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # deploy.yml と同じグループ。待機を含まないこのジョブだけに掛ける
    concurrency:
      group: "pages"
      cancel-in-progress: false

    steps:
      - name: チェックアウト
        uses: actions/checkout@v4

      - name: Python 3.12 セットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: 依存パッケージ インストール
        run: pip install -r requirements.txt

      - name: テスト実行 (pytest)
        run: pytest

      - name: gather.py 実行（通知なし）
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python gather.py --no-notify

      - name: gadget.py 実行（通知なし）
        # ガジェット側の失敗で IT ニュースの更新・通知を止めない
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python gadget.py --no-notify

      - name: 通知用データを保存
        uses: actions/upload-artifact@v4
        with:
          name: notify-data
          path: |
            data.json
            digest.json
            gadgets.json
          if-no-files-found: warn
          retention-days: 1

      - name: 結果を自動コミット & プッシュ
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json archive/ feed.xml
          if [ -f digest.json ]; then git add digest.json; fi
          if [ -f gadgets.json ]; then git add gadgets.json; fi
          git pull --rebase origin main || true
          git diff --cached --quiet || git commit -m "chore: データ更新 $(date +'%Y-%m-%d %H:%M UTC')"
          git push

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  notify:
    needs: collect
    runs-on: ubuntu-latest
    # 07:00 JST までの待機を含む
    timeout-minutes: 240
    permissions:
      contents: read

    steps:
      - name: チェックアウト
        uses: actions/checkout@v4

      - name: Python 3.12 セットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: 依存パッケージ インストール
        run: pip install -r requirements.txt

      - name: 通知用データを取得
        uses: actions/download-artifact@v4
        with:
          name: notify-data

      - name: 通知送信
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          # 定期実行時のみ 07:00 JST まで待って通知（手動実行は即時）
          NOTIFY_AT_JST: ${{ github.event_name == 'schedule' && '07:00' || '' }}
        run: python gather.py --notify-only

      - name: ガジェット通知送信
        # 上のステップで 07:00 まで待機済みのため即時送信。失敗しても IT ニュース通知には影響させない
        continue-on-error: true
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          NOTIFY_AT_JST: ${{ github.event_name == 'schedule' && '07:00' || '' }}
        run: python gadget.py --notify-only

  alert:
    needs: [collect, notify]
    # タイムアウト・キャンセル時も通知する
    if: ${{ failure() || cancelled() }}
    runs-on: ubuntu-latest
    permissions: {}

    steps:
      - name: 失敗時 Discord アラート
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          if [ -n "$DISCORD_WEBHOOK_URL" ]; then
            curl -H "Content-Type: application/json" \
              -d "{\"username\": \"🚨 GitHub Actions\", \"content\": \"❌ **IT Info Collector** のワークフローが失敗しました（collect: ${{ needs.collect.result }} / notify: ${{ needs.notify.result }}）。\\n🔗 [ログを確認](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})\"}" \
              "$DISCORD_WEBHOOK_URL"
          fi
