name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:
  # 定期実行分のデプロイは update.yml の collect ジョブ内で行う

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: 公開用ディレクトリ生成 (_site)
        run: |
          rm -rf _site
          mkdir -p _site
          for f in index.html gadget.html sw.js manifest.json .nojekyll data.json gadgets.json digest.json feed.xml gadget_feed.xml feed_*.xml; do
            if [ -f "$f" ]; then cp "$f" _site/; fi
          done
          if [ -d archive ]; then cp -r archive _site/; fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
