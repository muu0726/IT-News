name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:
  # 定期実行分のデプロイは update.yml の deploy ジョブで行う

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Pages アーティファクト作成・アップロード
        uses: ./.github/actions/upload-pages-site

  deploy:
    needs: build
    uses: ./.github/workflows/deploy-pages.yml
    permissions:
      actions: read
      pages: write
      id-token: write
